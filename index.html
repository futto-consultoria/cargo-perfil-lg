<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil de Cargos · Futto</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap');

  :root {
    --cream:   #FAF9F7;
    --cream-2: #F3F1EE;
    --slate:   #26383F;
    --slate-2: #3a5059;
    --red:     #E63946;
    --red-2:   #c62d39;
    --text:    #1a2c32;
    --muted:   #6b8590;
    --border:  #ddd8d0;
    --white:   #ffffff;
    --ok:      #2d7a4f;
    --ok-bg:   #eaf6f0;
    --warn:    #b45309;
    --warn-bg: #fef3c7;
    --radius:  8px;
    --shadow:  0 2px 12px rgba(38,56,63,.10);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

  /* ── LOGIN ── */
  #loginScreen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--slate); }
  .login-card { background: var(--white); border-radius: 16px; padding: 48px 44px; width: 100%; max-width: 400px; box-shadow: 0 24px 64px rgba(0,0,0,.28); }
  .login-brand { font-family: 'DM Serif Display', serif; font-size: 28px; color: var(--slate); margin-bottom: 4px; }
  .login-brand span { color: var(--red); }
  .login-sub { font-size: 13px; color: var(--muted); margin-bottom: 36px; }
  .login-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .login-field label { font-size: 12px; font-weight: 600; color: var(--slate); text-transform: uppercase; letter-spacing: .8px; }
  .login-field input { padding: 11px 14px; border: 1.5px solid var(--border); border-radius: var(--radius); font-family: 'Inter', sans-serif; font-size: 14px; color: var(--text); outline: none; transition: border-color .2s; }
  .login-field input:focus { border-color: var(--slate); }
  .btn-login { width: 100%; margin-top: 8px; padding: 13px; background: var(--slate); color: var(--white); border: none; border-radius: var(--radius); font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .2s; }
  .btn-login:hover { background: var(--slate-2); }
  .btn-login:disabled { background: var(--border); cursor: not-allowed; }
  .login-error { margin-top: 12px; padding: 10px 14px; background: #fef2f2; border: 1px solid #fecaca; border-radius: var(--radius); font-size: 13px; color: var(--red); display: none; }

  /* ── APP ── */
  #appScreen { display: none; flex-direction: column; flex: 1; }

  /* ── HEADER ── */
  header { background: var(--slate); padding: 0 40px; display: flex; align-items: center; justify-content: space-between; height: 64px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 16px rgba(0,0,0,.18); }
  .logo { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--white); }
  .logo span { color: var(--red); }
  .header-center { display: flex; gap: 4px; }
  .tab-btn { padding: 8px 20px; border-radius: 6px; border: none; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; background: transparent; color: rgba(255,255,255,.55); }
  .tab-btn:hover { background: rgba(255,255,255,.08); color: var(--white); }
  .tab-btn.active { background: rgba(255,255,255,.15); color: var(--white); }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .user-badge { font-size: 12px; color: rgba(255,255,255,.6); }
  .user-badge strong { color: rgba(255,255,255,.9); }
  .btn-logout { font-size: 12px; font-weight: 600; color: rgba(255,255,255,.55); background: none; border: 1px solid rgba(255,255,255,.2); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-family: 'Inter', sans-serif; transition: all .15s; }
  .btn-logout:hover { color: var(--white); border-color: rgba(255,255,255,.4); }

  /* ── PROGRESS ── */
  .progress-wrap { background: var(--slate-2); height: 4px; position: sticky; top: 64px; z-index: 99; }
  .progress-bar { height: 100%; background: var(--red); transition: width .4s ease; }

  /* ── VIEWS ── */
  #viewDashboard, #viewPreenchimento { display: none; flex: 1; }
  #viewDashboard.active, #viewPreenchimento.active { display: flex; }

  /* ══ DASHBOARD ══ */
  #viewDashboard { flex-direction: column; padding: 40px 48px; }

  .dash-top { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 36px; }
  .dash-card { background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 20px 24px; }
  .dash-card-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .dash-card-value { font-family: 'DM Serif Display', serif; font-size: 36px; color: var(--slate); line-height: 1; margin-bottom: 4px; }
  .dash-card-value.ok  { color: var(--ok); }
  .dash-card-value.warn { color: var(--warn); }
  .dash-card-sub { font-size: 12px; color: var(--muted); }

  .dash-section-title { font-size: 11px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
  .dash-section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* tabela */
  .dash-table-wrap { background: var(--white); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th { background: var(--cream-2); padding: 11px 14px; text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .12s; cursor: pointer; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--cream); }
  tbody td { padding: 11px 14px; font-size: 13px; color: var(--text); vertical-align: middle; }
  td.cargo-nome-cell { font-weight: 500; max-width: 280px; }
  td.cargo-codigo-cell { font-size: 11px; color: var(--muted); font-weight: 600; white-space: nowrap; }

  .pill { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; font-size: 11px; font-weight: 700; }
  .pill-ok   { background: var(--ok-bg);  color: var(--ok); }
  .pill-miss { background: #fef2f2;        color: var(--red); }
  .pill-empty { background: var(--cream-2); color: var(--border); }

  .row-status { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .row-status.completo   { background: var(--ok-bg);  color: var(--ok); }
  .row-status.parcial    { background: var(--warn-bg); color: var(--warn); }
  .row-status.vazio      { background: var(--cream-2); color: var(--muted); }

  .dash-filter { display: flex; gap: 8px; margin-bottom: 16px; }
  .filter-chip { padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--border); font-size: 12px; font-weight: 600; cursor: pointer; background: var(--white); color: var(--muted); font-family: 'Inter', sans-serif; transition: all .15s; }
  .filter-chip.active { background: var(--slate); border-color: var(--slate); color: var(--white); }
  .filter-chip:hover:not(.active) { border-color: var(--slate-2); color: var(--slate); }

  /* ══ PREENCHIMENTO ══ */
  #viewPreenchimento { flex-direction: row; }
  .sidebar { background: var(--white); border-right: 1px solid var(--border); display: flex; flex-direction: column; width: 300px; flex-shrink: 0; height: calc(100vh - 68px); position: sticky; top: 68px; overflow: hidden; }
  .sidebar-header { padding: 20px 20px 12px; border-bottom: 1px solid var(--border); background: var(--cream-2); }
  .sidebar-header h2 { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .search-box { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; font-family: 'Inter', sans-serif; background: var(--white); outline: none; transition: border-color .2s; }
  .search-box:focus { border-color: var(--slate); }
  .cargo-list { overflow-y: auto; flex: 1; padding: 8px 0; }
  .cargo-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; cursor: pointer; border-left: 3px solid transparent; transition: all .15s; font-size: 13px; line-height: 1.4; }
  .cargo-item:hover { background: var(--cream); }
  .cargo-item.active { background: var(--cream-2); border-left-color: var(--red); }
  .cargo-item.done .item-badge { background: var(--ok); }
  .item-badge { min-width: 22px; height: 22px; border-radius: 50%; background: var(--border); font-size: 10px; font-weight: 700; color: var(--white); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .item-code { font-size: 10px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .item-name { color: var(--text); flex: 1; }
  .sidebar-footer { padding: 14px 20px; border-top: 1px solid var(--border); background: var(--cream-2); }
  .stats-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .stat-chip { flex: 1; text-align: center; background: var(--white); border: 1px solid var(--border); border-radius: 6px; padding: 6px 4px; font-size: 11px; color: var(--muted); }
  .stat-chip strong { display: block; font-size: 18px; color: var(--text); }
  .stat-chip.s-ok strong { color: var(--ok); }
  .btn-export { width: 100%; padding: 11px; background: var(--red); color: var(--white); border: none; border-radius: var(--radius); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .2s; }
  .btn-export:hover { background: var(--red-2); }

  main { padding: 40px 48px; max-width: 900px; flex: 1; }

  /* ── SPINNER ── */
  .spinner-wrap { display: flex; align-items: center; justify-content: center; height: 60vh; flex-direction: column; gap: 16px; color: var(--muted); }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--slate); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .cargo-header { margin-bottom: 32px; padding-bottom: 24px; border-bottom: 2px solid var(--border); }
  .cargo-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--red); margin-bottom: 6px; }
  .cargo-title { font-family: 'DM Serif Display', serif; font-size: 28px; color: var(--slate); line-height: 1.2; margin-bottom: 8px; }
  .cargo-meta { font-size: 12px; color: var(--muted); }
  .cargo-meta strong { color: var(--ok); }

  .section { margin-bottom: 36px; }
  .section-label { font-size: 11px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .field-group { display: flex; flex-direction: column; gap: 20px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; font-weight: 600; color: var(--slate); }
  textarea, select.field-select { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: var(--radius); font-family: 'Inter', sans-serif; font-size: 14px; color: var(--text); background: var(--white); outline: none; transition: border-color .2s, box-shadow .2s; resize: vertical; }
  textarea:focus, select.field-select:focus { border-color: var(--slate); box-shadow: 0 0 0 3px rgba(38,56,63,.09); }
  textarea { min-height: 100px; line-height: 1.6; }
  .counter { font-size: 11px; color: var(--muted); text-align: right; margin-top: 3px; }
  .counter.warn { color: var(--warn); }
  .counter.over { color: var(--red); font-weight: 600; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

  .idioma-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .idioma-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: center; background: var(--cream-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
  .stars-select { display: flex; gap: 4px; align-items: center; }
  .star-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 0; color: #d1ccc4; transition: color .1s; line-height: 1; }
  .star-btn.active { color: #f5a623; }
  .fluencia-label { font-size: 11px; color: var(--muted); margin-left: 6px; }
  .btn-remove { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 4px 8px; font-size: 16px; cursor: pointer; transition: all .15s; line-height: 1; }
  .btn-remove:hover { border-color: var(--red); color: var(--red); }
  .btn-add { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: var(--white); border: 1.5px dashed var(--border); border-radius: var(--radius); font-size: 13px; color: var(--slate-2); cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 500; transition: all .15s; }
  .btn-add:hover { border-color: var(--slate); background: var(--cream-2); }

  .comp-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .comp-tab { padding: 7px 16px; border-radius: 20px; border: 1.5px solid var(--border); font-size: 12px; font-weight: 600; cursor: pointer; background: var(--white); color: var(--muted); font-family: 'Inter', sans-serif; transition: all .15s; }
  .comp-tab.active-tab { background: var(--slate); border-color: var(--slate); color: var(--white); }
  .comp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .comp-chip { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--white); border: 1.5px solid var(--border); border-radius: 6px; font-size: 12.5px; cursor: pointer; transition: all .15s; user-select: none; }
  .comp-chip:hover { border-color: var(--slate-2); }
  .comp-chip.selected { border-color: var(--slate); background: var(--slate); color: var(--white); }
  .chip-check { font-size: 14px; color: var(--border); flex-shrink: 0; }
  .comp-chip.selected .chip-check { color: var(--red); }

  .action-row { display: flex; gap: 12px; margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border); }
  .btn-nav { flex: 1; padding: 12px; border: 1.5px solid var(--border); border-radius: var(--radius); background: var(--white); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; color: var(--slate); cursor: pointer; transition: all .15s; }
  .btn-nav:hover { border-color: var(--slate); background: var(--cream-2); }
  .btn-save { flex: 2; padding: 12px; background: var(--slate); border: none; border-radius: var(--radius); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; color: var(--white); cursor: pointer; transition: background .2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-save:hover { background: var(--slate-2); }
  .btn-save:disabled { background: var(--border); cursor: not-allowed; }

  /* ── EMPTY STATE ── */
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; text-align: center; color: var(--muted); }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state h3 { font-size: 20px; color: var(--slate); margin-bottom: 8px; }
  .empty-state p { font-size: 14px; line-height: 1.6; max-width: 340px; }

  /* ── TOAST ── */
  .toast { position: fixed; bottom: 28px; right: 28px; background: var(--slate); color: var(--white); padding: 12px 20px; border-radius: var(--radius); font-size: 13px; font-weight: 500; box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); transition: all .25s; z-index: 999; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { background: var(--ok); }
  .toast.error   { background: var(--red); }

  /* ── MODAL ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,44,50,.55); z-index: 500; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--white); border-radius: 12px; padding: 32px; max-width: 480px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .modal h3 { font-size: 18px; color: var(--slate); margin-bottom: 8px; }
  .modal p  { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 24px; }
  .modal-actions { display: flex; gap: 12px; }
  .btn-modal-cancel { flex: 1; padding: 10px; border: 1.5px solid var(--border); border-radius: var(--radius); background: var(--white); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; color: var(--slate); cursor: pointer; }
  .btn-modal-ok { flex: 1; padding: 10px; background: var(--red); border: none; border-radius: var(--radius); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; color: var(--white); cursor: pointer; }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-brand">Futto<span>.</span></div>
    <div class="login-sub">Perfil de Cargos — LG Lugar de Gente</div>
    <div class="login-field">
      <label>E-mail</label>
      <input type="email" id="loginEmail" placeholder="seu@email.com" autocomplete="email">
    </div>
    <div class="login-field">
      <label>Senha</label>
      <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-login" id="btnLogin" onclick="doLogin()">Entrar</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- APP -->
<div id="appScreen">
  <header>
    <div class="logo">Futto<span>.</span></div>
    <div class="header-center">
      <button class="tab-btn active" id="tabDashboard" onclick="switchView('dashboard')">📊 Dashboard</button>
      <button class="tab-btn" id="tabPreenchimento" onclick="switchView('preenchimento')">✏️ Preenchimento</button>
    </div>
    <div class="header-right">
      <div class="user-badge" id="userBadge"></div>
      <button class="btn-logout" onclick="doLogout()">Sair</button>
    </div>
  </header>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>

  <!-- VIEW DASHBOARD -->
  <div id="viewDashboard" class="active">
    <div class="dash-top" id="dashCards"></div>
    <div class="dash-section-title">Situação por cargo</div>
    <div class="dash-filter" id="dashFilter">
      <button class="filter-chip active" onclick="setFilter('todos',this)">Todos</button>
      <button class="filter-chip" onclick="setFilter('vazio',this)">Não iniciados</button>
      <button class="filter-chip" onclick="setFilter('parcial',this)">Incompletos</button>
      <button class="filter-chip" onclick="setFilter('completo',this)">Completos</button>
    </div>
    <div class="dash-table-wrap">
      <table>
        <thead>
          <tr>
            <th>Cód.</th>
            <th>Cargo</th>
            <th style="text-align:center">Descrição</th>
            <th style="text-align:center">Escolaridade</th>
            <th style="text-align:center">Experiência</th>
            <th style="text-align:center">Idiomas</th>
            <th style="text-align:center">Competências</th>
            <th style="text-align:center">Status</th>
          </tr>
        </thead>
        <tbody id="dashTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- VIEW PREENCHIMENTO -->
  <div id="viewPreenchimento">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Cargos</h2>
        <input class="search-box" type="text" placeholder="Buscar cargo..." id="searchInput" oninput="filterCargos()">
      </div>
      <div class="cargo-list" id="cargoList"></div>
      <div class="sidebar-footer">
        <div class="stats-row">
          <div class="stat-chip s-ok"><strong id="statDone">0</strong>salvos</div>
          <div class="stat-chip"><strong id="statTotal">0</strong>total</div>
        </div>
        <button class="btn-export" onclick="openExportModal()">⬇ Exportar CSVs para LG</button>
      </div>
    </aside>
    <main id="mainArea">
      <div class="spinner-wrap"><div class="spinner"></div><span>Carregando...</span></div>
    </main>
  </div>
</div>

<!-- MODAL EXPORTAÇÃO -->
<div class="modal-overlay" id="exportModal">
  <div class="modal">
    <h3>Exportar arquivos para LG</h3>
    <p id="exportModalText"></p>
    <div class="modal-actions">
      <button class="btn-modal-cancel" id="btnModalCancel" onclick="closeExportModal()">Cancelar</button>
      <button class="btn-modal-ok" id="btnModalOk" onclick="doExport()">Exportar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════
const SUPABASE_URL  = 'https://xhctjycyydgekgcabfzh.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoY3RqeWN5eWRnZWtnY2FiZnpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NDY4OTQsImV4cCI6MjEwMjAyMjg5NH0.gsDIPUWuoUuzjV2Dg9-NPZLggowdAieY6hrLx8mabLY';

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPassword').value;
  const btn   = document.getElementById('btnLogin');
  if (!email || !pass) { showLoginError('Preencha e-mail e senha.'); return; }
  btn.disabled = true; btn.textContent = 'Entrando...';
  document.getElementById('loginError').style.display = 'none';
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) {
    showLoginError('E-mail ou senha incorretos.');
    btn.disabled = false; btn.textContent = 'Entrar';
    return;
  }
  currentUser = data.user;
  await initApp();
}

  const err = document.getElementById('loginError');

async function carregarTodosPerfis() {

  if (error) { showToast('Erro ao carregar dados', 'error'); return; }
  perfisCache = {};
  (data || []).forEach(row => { perfisCache[row.cargo_codigo] = row; });
}

function getPerfil(codigo) {
  if (!perfisCache[codigo]) {
    perfisCache[codigo] = { cargo_codigo: codigo, tenant_id: TENANT_ID, desc_resumida: '', desc_detalhada: '', grau_instrucao: null, obs_escolaridade: '', experiencia: null, obs_experiencia: '', idiomas: [], competencias: [], updated_at: null, _novo: true };
  }
  return perfisCache[codigo];
}

// ═══════════════════════════════════════════════
// STATUS DO CARGO (para dashboard)
// ═══════════════════════════════════════════════
function getCargoStatus(codigo) {
  const p = perfisCache[codigo];
  if (!p || p._novo) return 'vazio';

  const campos = {
    descricao:    !!(p.desc_resumida || p.desc_detalhada),
    escolaridade: !!(p.grau_instrucao),
    experiencia:  !!(p.experiencia),
    idiomas:      !!(p.idiomas && p.idiomas.length > 0),
    competencias: !!(p.competencias && p.competencias.length > 0)
  };

  const total     = Object.keys(campos).length;
  const preenchidos = Object.values(campos).filter(Boolean).length;

  if (preenchidos === 0)     return 'vazio';
  if (preenchidos === total) return 'completo';
  return 'parcial';
}

function getCampos(codigo) {
  const p = perfisCache[codigo];
  if (!p || p._novo) return { descricao: false, escolaridade: false, experiencia: false, idiomas: false, competencias: false };
  return {
    descricao:    !!(p.desc_resumida || p.desc_detalhada),
    escolaridade: !!(p.grau_instrucao),
    experiencia:  !!(p.experiencia),
    idiomas:      !!(p.idiomas && p.idiomas.length > 0),
    competencias: !!(p.competencias && p.competencias.length > 0)
  };
}

function isPreenchido(codigo) { return getCargoStatus(codigo) !== 'vazio'; }
function countDone()          { return CARGOS.filter(c => getCargoStatus(c.codigo) === 'completo').length; }
function countParcial()       { return CARGOS.filter(c => getCargoStatus(c.codigo) === 'parcial').length; }
function countVazio()         { return CARGOS.filter(c => getCargoStatus(c.codigo) === 'vazio').length; }

function renderDashboard() {
  const total    = CARGOS.length;
  const completo = countDone();
  const parcial  = countParcial();
  const vazio    = countVazio();
  const pct      = Math.round((completo / total) * 100);

  document.getElementById('progressBar').style.width = pct + '%';

  document.getElementById('dashCards').innerHTML = `
    <div class="dash-card">
      <div class="dash-card-label">Total de cargos</div>
      <div class="dash-card-value">${total}</div>
      <div class="dash-card-sub">neste projeto</div>
    </div>
    <div class="dash-card">
      <div class="dash-card-label">Completos</div>
      <div class="dash-card-value ok">${completo}</div>
      <div class="dash-card-sub">todos os campos preenchidos</div>
    </div>
    <div class="dash-card">
      <div class="dash-card-label">Incompletos</div>
      <div class="dash-card-value warn">${parcial}</div>
      <div class="dash-card-sub">falta algum campo</div>
    </div>
    <div class="dash-card">
      <div class="dash-card-label">Não iniciados</div>
      <div class="dash-card-value">${vazio}</div>
      <div class="dash-card-sub">${pct}% concluído</div>
    </div>`;

  renderDashTable();
}

function setFilter(f, el) {
  dashFilter = f;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderDashTable();
}

function renderDashTable() {
  const body = document.getElementById('dashTableBody');
  const filtered = CARGOS.filter(c => {
    if (dashFilter === 'todos') return true;
    return getCargoStatus(c.codigo) === dashFilter;
  });

  if (filtered.length === 0) {
    body.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:32px;color:var(--muted)">Nenhum cargo nesta categoria.</td></tr>`;
    return;
  }

  body.innerHTML = filtered.map(c => {
    const campos  = getCampos(c.codigo);
    const status  = getCargoStatus(c.codigo);

    const pill = (ok, campo) => {
      const tip = ok ? `${campo}: preenchido` : `${campo}: não preenchido — clique para editar`;
      const cls = ok ? 'pill-ok' : 'pill-miss';
      const ico = ok ? '✓' : '✗';
      return `<span class="pill ${cls}" title="${tip}">${ico}</span>`;
    };

    const statusLabel = { completo: 'Completo', parcial: 'Incompleto', vazio: 'Não iniciado' }[status];

    return `<tr onclick="abrirCargoDosDashboard('${c.codigo}')" title="Clique para abrir e editar este cargo">
      <td class="cargo-codigo-cell">#${c.codigo}</td>
      <td class="cargo-nome-cell">${c.nome}</td>
      <td style="text-align:center">${pill(campos.descricao,    'Descrição')}</td>
      <td style="text-align:center">${pill(campos.escolaridade, 'Escolaridade')}</td>
      <td style="text-align:center">${pill(campos.experiencia,  'Experiência')}</td>
      <td style="text-align:center">${pill(campos.idiomas,      'Idiomas')}</td>
      <td style="text-align:center">${pill(campos.competencias, 'Competências')}</td>
      <td style="text-align:center"><span class="row-status ${status}">${statusLabel}</span></td>
    </tr>`;
  }).join('');
}

function abrirCargoDosDashboard(codigo) {
  switchView('preenchimento');
  selectCargo(codigo);
  // scroll para o cargo na sidebar
  setTimeout(() => {
    const el = document.querySelector(`.cargo-item.active`);
    if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }, 100);
}

async function salvarNoBanco(codigo) {
  if (isSaving) return;
  isSaving = true;
  const btn = document.getElementById('btnSalvar');
  if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Salvando...'; }

  const p = getPerfil(codigo);
  const g = id => { const el = document.getElementById(id); return el ? el.value : ''; };

  const payload = {
    tenant_id: TENANT_ID, cargo_codigo: codigo,
    desc_resumida:    g('descResumida'),
    desc_detalhada:   g('descDetalhada'),
    grau_instrucao:   g('grauInstrucao') ? parseInt(g('grauInstrucao')) : null,
    obs_escolaridade: g('obsEscolaridade'),
    experiencia:      g('experiencia') ? parseInt(g('experiencia')) : null,
    obs_experiencia:  g('obsExperiencia'),
    idiomas:          p.idiomas || [],
    competencias:     p.competencias || [],
    updated_at:       new Date().toISOString(),
    updated_by:       currentUser.id
  };

  const { error: errUpsert } = await sb.from('cargo_perfil').upsert(payload, { onConflict: 'tenant_id,cargo_codigo' });
  if (errUpsert) {
    showToast('Erro ao salvar: ' + errUpsert.message, 'error');
    isSaving = false;
    if (btn) { btn.disabled = false; btn.innerHTML = '✓ Salvar cargo'; }
    return;
  }

  await sb.from('audit_log').insert({
    tenant_id: TENANT_ID, cargo_codigo: codigo,
    user_id: currentUser.id, user_email: currentUser.email,
    snapshot: payload, saved_at: new Date().toISOString()
  });

  perfisCache[codigo] = { ...payload, _novo: false };
  renderSidebar(document.getElementById('searchInput').value);

  const metaEl = document.getElementById('cargoMeta');
  if (metaEl) metaEl.innerHTML = `Último save: <strong>${new Date().toLocaleString('pt-BR')}</strong> por ${currentUser.email}`;

  showToast('Cargo salvo com sucesso!', 'success');
  isSaving = false;
  if (btn) { btn.disabled = false; btn.innerHTML = '✓ Salvar cargo'; }
}

// ═══════════════════════════════════════════════
function renderSidebar(filter = '') {
  const term     = filter.toLowerCase();
  const filtered = CARGOS.filter(c => c.nome.toLowerCase().includes(term) || c.codigo.includes(term));

  document.getElementById('cargoList').innerHTML = filtered.map(c => {
    const status = getCargoStatus(c.codigo);
    const done   = status === 'completo';
    const active = cargoAtual === c.codigo ? 'active' : '';
    const cls    = done ? 'done' : '';
    const badge  = done ? '✓' : c.codigo;
    return `<div class="cargo-item ${active} ${cls}" onclick="selectCargo('${c.codigo}')">
      <span class="item-badge">${badge}</span>
      <span class="item-code">#${c.codigo}</span>
      <span class="item-name">${c.nome}</span>
    </div>`;
  }).join('');

  const done  = countDone();
  const total = CARGOS.length;
  document.getElementById('statDone').textContent  = done;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('progressBar').style.width = Math.round((done / total) * 100) + '%';
}

function filterCargos() { renderSidebar(document.getElementById('searchInput').value); }

// ═══════════════════════════════════════════════
// FORMULÁRIO
// ═══════════════════════════════════════════════
function selectCargo(codigo) {
  cargoAtual = codigo;
  renderSidebar(document.getElementById('searchInput').value);
  renderForm(codigo);
}

function renderForm(codigo) {
  const cargo = CARGOS.find(c => c.codigo === codigo);
  const p     = getPerfil(codigo);
  const idx   = CARGOS.findIndex(c => c.codigo === codigo);
  const updatedAt = p.updated_at ? `Último save: <strong>${new Date(p.updated_at).toLocaleString('pt-BR')}</strong>` : 'Ainda não salvo';

  document.getElementById('mainArea').innerHTML = `
  <div class="cargo-header">
    <div class="cargo-eyebrow">Código ${cargo.codigo}</div>
    <div class="cargo-title">${cargo.nome}</div>
    <div class="cargo-meta" id="cargoMeta">${updatedAt}</div>
  </div>
  <div class="section">
    <div class="section-label">Descrição</div>
    <div class="field-group">
      <div class="field">
        <label>Descrição Resumida</label>
        <textarea id="descResumida" maxlength="1500" oninput="updateCounter('descResumida',1500)" placeholder="Descreva brevemente as responsabilidades principais...">${esc(p.desc_resumida)}</textarea>
        <div class="counter" id="ctr-descResumida">${(p.desc_resumida||'').length}/1500</div>
      </div>
      <div class="field">
        <label>Descrição Detalhada</label>
        <textarea id="descDetalhada" style="min-height:140px" maxlength="5500" oninput="updateCounter('descDetalhada',5500)" placeholder="Descreva em detalhes atividades, responsabilidades e atribuições...">${esc(p.desc_detalhada)}</textarea>
        <div class="counter" id="ctr-descDetalhada">${(p.desc_detalhada||'').length}/5500</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="section-label">Escolaridade</div>
    <div class="field-group">
      <div class="row-2">
        <div class="field">
          <label>Grau de Instrução</label>
          <select class="field-select" id="grauInstrucao">
            <option value="">— Selecione —</option>
            ${GRAUS_INSTRUCAO.map(g => `<option value="${g.v}" ${p.grau_instrucao==g.v?'selected':''}>${g.t}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field">
        <label>Observações sobre Escolaridade</label>
        <textarea id="obsEscolaridade" maxlength="1500" oninput="updateCounter('obsEscolaridade',1500)" placeholder="Formações, certificações, cursos complementares...">${esc(p.obs_escolaridade)}</textarea>
        <div class="counter" id="ctr-obsEscolaridade">${(p.obs_escolaridade||'').length}/1500</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="section-label">Experiência</div>
    <div class="field-group">
      <div class="row-2">
        <div class="field">
          <label>Experiência Necessária</label>
          <select class="field-select" id="experiencia">
            <option value="">— Selecione —</option>
            ${EXPERIENCIAS.map(e => `<option value="${e.v}" ${p.experiencia==e.v?'selected':''}>${e.t}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field">
        <label>Observações sobre Experiência</label>
        <textarea id="obsExperiencia" maxlength="1500" oninput="updateCounter('obsExperiencia',1500)" placeholder="Áreas de experiência, setor de atuação...">${esc(p.obs_experiencia)}</textarea>
        <div class="counter" id="ctr-obsExperiencia">${(p.obs_experiencia||'').length}/1500</div>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="section-label">Idiomas</div>
    <div id="idiomaList"></div>
    <button class="btn-add" onclick="adicionarIdioma()">+ Adicionar idioma</button>
  </div>
  <div class="section">
    <div class="section-label">Competências</div>
    <div class="comp-tabs">
      <button class="comp-tab ${activeCompTab===1?'active-tab':''}" onclick="setCompTab(1)">Comportamental</button>
      <button class="comp-tab ${activeCompTab===2?'active-tab':''}" onclick="setCompTab(2)">Técnica</button>
      <button class="comp-tab ${activeCompTab===3?'active-tab':''}" onclick="setCompTab(3)">Organizacional</button>
    </div>
    <div class="comp-grid" id="compGrid"></div>
  </div>
  <div class="action-row">
    ${idx > 0 ? `<button class="btn-nav" onclick="navegarCargo(-1)">← Anterior</button>` : `<span></span>`}
    <button class="btn-save" id="btnSalvar" onclick="salvarNoBanco('${codigo}')">✓ Salvar cargo</button>
    ${idx < CARGOS.length-1 ? `<button class="btn-nav" onclick="navegarCargo(1)">Próximo →</button>` : `<span></span>`}
  </div>`;

  renderIdiomaList();
  renderCompGrid();
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function updateCounter(id, max) {
  const el = document.getElementById(id), ctr = document.getElementById('ctr-'+id);
  if (!el||!ctr) return;
  const len = el.value.length;
  ctr.textContent = len+'/'+max;
  ctr.className = 'counter'+(len>=max?' over':len>max*.9?' warn':'');
}

// ── IDIOMAS ──
function renderIdiomaList() {
  const p = getPerfil(cargoAtual), div = document.getElementById('idiomaList');
  if (!div) return;
  const idiomas = p.idiomas||[];
  if (!idiomas.length) { div.innerHTML=''; return; }
  div.innerHTML = `<div class="idioma-list">${idiomas.map((item,i)=>`
    <div class="idioma-row">
      <select class="field-select" onchange="updateIdioma(${i},'idIdm',this.value)">
        <option value="">— Idioma —</option>
        ${IDIOMAS.map(id=>`<option value="${id.codigo}" ${item.idIdm==id.codigo?'selected':''}>${id.nome}</option>`).join('')}
      </select>
      <div class="stars-select">
        ${[1,2,3,4].map(n=>`<button class="star-btn ${item.fluencia>=n?'active':''}" onclick="setFluencia(${i},${n})" title="${FLUENCIAS[n-1].nome}">★</button>`).join('')}
        <span class="fluencia-label">${item.fluencia?FLUENCIAS[item.fluencia-1].nome:''}</span>
      </div>
      <button class="btn-remove" onclick="removerIdioma(${i})">×</button>
    </div>`).join('')}
  </div>`;
}

function adicionarIdioma() { const p=getPerfil(cargoAtual); p.idiomas=p.idiomas||[]; p.idiomas.push({idIdm:'',fluencia:0}); renderIdiomaList(); }
function updateIdioma(i,c,v) { getPerfil(cargoAtual).idiomas[i][c]=v; renderIdiomaList(); }
function setFluencia(i,n)    { getPerfil(cargoAtual).idiomas[i].fluencia=n; renderIdiomaList(); }
function removerIdioma(i)    { getPerfil(cargoAtual).idiomas.splice(i,1); renderIdiomaList(); }

// ── COMPETÊNCIAS ──
function setCompTab(g) {
  activeCompTab=g;
  document.querySelectorAll('.comp-tab').forEach((t,i)=>t.classList.toggle('active-tab',i+1===g));
  renderCompGrid();
}
function renderCompGrid() {
  const p=getPerfil(cargoAtual), grid=document.getElementById('compGrid');
  if (!grid) return;
  const comps=p.competencias||[];
  grid.innerHTML=COMPETENCIAS.filter(c=>c.grupo===activeCompTab).map(c=>{
    const sel=comps.includes(c.codigo);
    return `<div class="comp-chip ${sel?'selected':''}" onclick="toggleComp(${c.codigo})">
      <span class="chip-check">${sel?'✓':'○'}</span><span>${c.nome}</span></div>`;
  }).join('');
}
function toggleComp(cod) {
  const p=getPerfil(cargoAtual); p.competencias=p.competencias||[];
  const i=p.competencias.indexOf(cod);
  if(i>=0) p.competencias.splice(i,1); else p.competencias.push(cod);
  renderCompGrid();
}

function navegarCargo(dir) {
  const i=CARGOS.findIndex(c=>c.codigo===cargoAtual), novo=CARGOS[i+dir];
  if (novo) selectCargo(novo.codigo);
}

// ═══════════════════════════════════════════════
// EXPORTAÇÃO
// ═══════════════════════════════════════════════
function openExportModal() {
  const done=countDone(), total=CARGOS.length;
  const modal=document.getElementById('exportModal'), txt=document.getElementById('exportModalText');
  const btnOk=document.getElementById('btnModalOk'), btnCc=document.getElementById('btnModalCancel');
  if (done===0) {
    txt.textContent='Nenhum cargo foi salvo ainda.'; btnOk.style.display='none'; btnCc.textContent='Fechar';
  } else {
    txt.innerHTML=done<total
      ? `<strong>${done} de ${total} cargos</strong> estão completos. Cargos parciais ou vazios serão ignorados. Deseja continuar?`
      : `Todos os <strong>${total} cargos</strong> estão completos. Pronto para exportar.`;
    btnOk.style.display=''; btnCc.textContent='Cancelar';
  }
  modal.classList.add('open');
}
function closeExportModal() { document.getElementById('exportModal').classList.remove('open'); }
function doExport() {
  closeExportModal();
  const cargos=CARGOS.filter(c=>isPreenchido(c.codigo));
  downloadCSV(gerarCSVCargo(cargos),       'Cargo.csv');
  downloadCSV(gerarCSVIdioma(cargos),      'Cargo_ListaPerfilIdioma.csv');
  downloadCSV(gerarCSVIdiomaCateg(cargos), 'Cargo_ListaPerfilIdiomaCategoria.csv');
  downloadCSV(gerarCSVCompetencia(cargos), 'Cargo_ListaPerfilCompetencia.csv');
  showToast(`${cargos.length} cargos exportados`, 'success');
}

function gerarCSVCargo(cargos) {
  return cargos.map(c=>{
    const p=perfisCache[c.codigo], cols=new Array(36).fill('');
    cols[0]=c.codigo; cols[13]=limpar(p.desc_resumida,1500); cols[14]=limpar(p.desc_detalhada,5500);
    cols[15]=p.grau_instrucao!=null?p.grau_instrucao:''; cols[16]=limpar(p.obs_escolaridade,1500);
    cols[17]=p.experiencia!=null?p.experiencia:''; cols[18]=limpar(p.obs_experiencia,1500);
    return cols.map(csvQuote).join(';');
  }).join('\r\n');
}
function gerarCSVIdioma(cargos) {
  const l=[];
  cargos.forEach(c=>(perfisCache[c.codigo].idiomas||[]).filter(i=>i.idIdm&&i.fluencia).forEach(i=>l.push([c.codigo,i.idIdm].map(csvQuote).join(';'))));
  return l.join('\r\n');
}
function gerarCSVIdiomaCateg(cargos) {
  const l=[];
  cargos.forEach(c=>(perfisCache[c.codigo].idiomas||[]).filter(i=>i.idIdm&&i.fluencia).forEach(i=>l.push([c.codigo,i.idIdm,FLUENCIA_CATEGORIA,i.fluencia].map(csvQuote).join(';'))));
  return l.join('\r\n');
}
function gerarCSVCompetencia(cargos) {
  const l=[];
  cargos.forEach(c=>(perfisCache[c.codigo].competencias||[]).forEach(cod=>l.push([c.codigo,cod,''].map(csvQuote).join(';'))));
  return l.join('\r\n');
}
function limpar(s,max) { return (s||'').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim().substring(0,max); }
function csvQuote(v) { const s=String(v??''); return (s.includes(';')||s.includes('"')||s.includes('\n'))?'"'+s.replace(/"/g,'""')+'"':s; }
function downloadCSV(content,filename) {
  const blob=new Blob(['\uFEFF'+content],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ── UTILS ──
function showToast(msg,type='') {
  const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show '+type;
  setTimeout(()=>{t.className='toast';},3500);
}

document.getElementById('loginPassword').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
checkSession();
</script>
